name: Inspect Voyage APK theme reference
on:
  push:
    branches:
      - tools/voyage-apk-inspection-20261025
    paths:
      - .github/workflows/voyage-apk-inspect.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Download the user-provided public Voyage release asset
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/iskyxpcity/AppData/releases/download/v1.0.21/voyage-release-1.0.21-alpha.01-arm64-v8a.apk"
          curl --fail --location --retry 3 --retry-delay 2 "$url" -o "$RUNNER_TEMP/voyage.apk"
          echo "APK_BYTES=$(stat -c%s "$RUNNER_TEMP/voyage.apk")" >> "$GITHUB_ENV"
          actual="$(sha256sum "$RUNNER_TEMP/voyage.apk" | awk '{print $1}')"
          expected="b74d1f49c152e1fdd1af8fd1e36fdedebe283f3c1e740066f281857c0682c0b1"
          echo "APK_SHA256=$actual"
          test "$actual" = "$expected"
          echo "APK checksum verified."
      - name: Install APK resource inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool unzip
      - name: Decode resources and inspect manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/voyage-analysis"
          apktool d -f --no-src "$RUNNER_TEMP/voyage.apk" -o "$RUNNER_TEMP/voyage-decoded" >/tmp/apktool.log 2>&1
          out="$RUNNER_TEMP/voyage-analysis/report.txt"
          {
            echo "Voyage APK inspection report"
            echo "APK bytes: $APK_BYTES"
            echo "SHA-256: $(sha256sum "$RUNNER_TEMP/voyage.apk" | awk '{print $1}')"
            echo
            echo "=== Manifest identity/theme/activities ==="
            grep -E 'package=|versionName|versionCode|android:label|android:theme|activity|application' "$RUNNER_TEMP/voyage-decoded/AndroidManifest.xml" | sed -n '1,160p' || true
            echo
            echo "=== Resource XML inventory ==="
            find "$RUNNER_TEMP/voyage-decoded/res" -type f \( -path '*/values*/*.xml' -o -path '*/drawable*/*' -o -path '*/font/*' \) | sed "s#$RUNNER_TEMP/voyage-decoded/##" | sed -n '1,500p' || true
            echo
            echo "=== Theme/style/color/dimension resource definitions ==="
            grep -RniE '<(style|color|dimen|font|item).*name=|<item name="(color|shape|corner|font|text|android:)' "$RUNNER_TEMP/voyage-decoded/res/values"* 2>/dev/null | sed -n '1,1200p' || true
            echo
            echo "=== Material/Compose dependency clues in DEX strings ==="
            unzip -p "$RUNNER_TEMP/voyage.apk" 'classes*.dex' 2>/dev/null | strings | grep -Ei 'MaterialTheme|material3|androidx.compose.material|dynamicDarkColorScheme|dynamicLightColorScheme|ColorScheme|Typography|Shape|tonalPalette|cornerRadius|containerColor' | sort -u | sed -n '1,500p' || true
          } > "$out"
          echo "=== INSPECTION REPORT (begin) ==="
          cat "$out"
          echo "=== INSPECTION REPORT (end) ==="
          cp "$RUNNER_TEMP/voyage-decoded/AndroidManifest.xml" "$RUNNER_TEMP/voyage-analysis/"
          mkdir -p "$RUNNER_TEMP/voyage-analysis/values"
          find "$RUNNER_TEMP/voyage-decoded/res" -maxdepth 2 -type d -name 'values*' -exec sh -c 'for d do cp -a "$d" "$1/values/"; done' sh "$RUNNER_TEMP/voyage-analysis" {} +
      - name: Decompile Compose theme implementation with JADX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jadx-bin" "$RUNNER_TEMP/voyage-analysis/decompiled"
          curl --fail --location --retry 3 https://api.github.com/repos/skylot/jadx/releases/latest -o "$RUNNER_TEMP/jadx-release.json"
          jadx_url="$(jq -r '[.assets[] | select(.name | endswith(".zip")) | .browser_download_url][0] // empty' "$RUNNER_TEMP/jadx-release.json")"
          test -n "$jadx_url"
          curl --fail --location --retry 3 "$jadx_url" -o "$RUNNER_TEMP/jadx.zip"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx-bin"
          jadx_bin="$(find "$RUNNER_TEMP/jadx-bin" -type f -path '*/bin/jadx' -print -quit)"
          test -n "$jadx_bin"
          chmod +x "$jadx_bin"
          "$jadx_bin" --deobf --show-bad-code -d "$RUNNER_TEMP/voyage-analysis/decompiled" "$RUNNER_TEMP/voyage.apk" >/tmp/jadx.log 2>&1
          {
            echo "=== Compose/Material theme source excerpts ==="
            grep -RnlE 'DynamicMaterialTheme|rememberDynamicColorScheme|dynamicColorScheme|MaterialTheme\(' "$RUNNER_TEMP/voyage-analysis/decompiled" --include='*.java' | sed -n '1,80p' > "$RUNNER_TEMP/theme-files.txt" || true
            while IFS= read -r f; do
              echo "--- $f ---"
              grep -nE -C 5 'DynamicMaterialTheme|rememberDynamicColorScheme|dynamicColorScheme|MaterialTheme\(' "$f" | sed -n '1,220p' || true
            done < "$RUNNER_TEMP/theme-files.txt"
            echo "=== App-specific theme-related identifiers ==="
            grep -RhoE '([A-Za-z0-9_]*(Theme|ColorScheme|TonalPalette|Typography|Palette|Material)[A-Za-z0-9_]*)' "$RUNNER_TEMP/voyage-analysis/decompiled/com" --include='*.java' 2>/dev/null | sort -u | sed -n '1,500p' || true
          } > "$RUNNER_TEMP/voyage-analysis/compose-theme-source.txt"
          sed -n '1,1600p' "$RUNNER_TEMP/voyage-analysis/compose-theme-source.txt"
      - name: Upload decoded reference report
        uses: actions/upload-artifact@v4
        with:
          name: voyage-apk-theme-inspection
          path: ${{ runner.temp }}/voyage-analysis/
          if-no-files-found: error
          retention-days: 3
