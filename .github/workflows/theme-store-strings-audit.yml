name: Temporary Theme Store strings source merge
on:
  push:
    branches: ["test/theme-store-service-20261024"]
permissions:
  contents: write
jobs:
  merge-strings:
    if: contains(github.event.head_commit.message, 'stage Theme Store strings archive')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact Theme Store resource wording from source archive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y p7zip-full >/dev/null
          base64 -d tools/theme-store-source.rar.b64 > /tmp/theme-store-source.rar
          mkdir -p /tmp/theme-store-source
          7z x /tmp/theme-store-source.rar -o/tmp/theme-store-source -y >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          pairs = [
              ("app/src/main/res/values/alohaoneui_strings.xml", "/tmp/theme-store-source/app/src/main/res/values/alohaoneui_strings.xml"),
              ("app/src/main/res/values-zh-rCN/alohaoneui_strings.xml", "/tmp/theme-store-source/app/src/main/res/values-zh-rCN/alohaoneui_strings.xml"),
          ]
          pattern = re.compile(r'^\s*<string\s+name="(alohaoneui_(?:setThemeStoreRegion|themeStoreRegion)[^"]*)".*</string>\s*$')
          for target_name, source_name in pairs:
              target, source = Path(target_name), Path(source_name)
              current_lines = target.read_text(encoding="utf-8").splitlines()
              source_lines = source.read_text(encoding="utf-8").splitlines()
              source_map = {}
              for line in source_lines:
                  match = pattern.match(line)
                  if match:
                      source_map[match.group(1)] = line
              if not source_map:
                  raise SystemExit(f"No Theme Store source strings found in {source_name}")
              seen = set()
              result = []
              for line in current_lines:
                  match = pattern.match(line)
                  if match and match.group(1) in source_map:
                      key = match.group(1)
                      result.append(source_map[key])
                      seen.add(key)
                  else:
                      result.append(line)
              if seen != set(source_map):
                  missing = set(source_map) - seen
                  raise SystemExit(f"Target resource missing Theme Store source keys: {sorted(missing)}")
              target.write_text("\n".join(result) + "\n", encoding="utf-8")
              print(f"{target_name}: restored {len(source_map)} source strings: {', '.join(sorted(source_map))}")
          PY
          git rm -f tools/theme-store-source.rar.b64 .github/workflows/theme-store-strings-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/values/alohaoneui_strings.xml app/src/main/res/values-zh-rCN/alohaoneui_strings.xml
          git commit -m "fix(theme-store): restore source string wording in both locales"
          git push origin HEAD:test/theme-store-service-20261024
