name: Apply KernelSU visual parity fixes
on:
  push:
    branches:
      - test/kernel-ui-dual-theme-20260922
    paths:
      - '.github/scripts/restore_kernelsu_style_20260922.py'
      - '.github/workflows/apply-kernelsu-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/kernel-ui-dual-theme-20260922
          persist-credentials: true
      - name: Verify and patch both UI implementations
        run: python3 .github/scripts/restore_kernelsu_style_20260922.py
      - name: Commit only visual modifications to test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/weishu/kernelsu/ui/theme/MiuixTheme.kt
          git add app/src/main/java/me/weishu/kernelsu/ui/theme/MaterialTheme.kt
          git add app/src/main/java/me/weishu/kernelsu/ui/screen/home/HomeMiuix.kt
          git add app/src/main/java/me/weishu/kernelsu/ui/screen/home/HomeMaterial.kt
          git add app/src/main/java/me/weishu/kernelsu/ui/screen/module/ModuleScreen.kt
          git add app/src/main/java/me/weishu/kernelsu/ui/screen/superuser/SuperUserScreen.kt
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changes; refusing empty commit'; exit 1; fi
          git commit -m 'Restore KernelSU default colors and both-theme collapsing titles'
          git push origin HEAD:test/kernel-ui-dual-theme-20260922
