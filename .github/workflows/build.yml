name: OneuiXP Android APK build
on:
  push:
    branches: [main, 'test/**', 'migration/**']
  workflow_dispatch:
concurrency:
  group: oneuixp-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read OneuiXP version
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^oneuixpVersionName=//p' gradle.properties)
          VERSION_CODE=$(sed -n 's/^oneuixpVersionCode=//p' gradle.properties)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Select debug or optimized release build
        run: |
          set -euo pipefail
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [[ "$COMMIT_SUBJECT" == release:* ]]; then
            echo "BUILD_VARIANT=release" >> "$GITHUB_ENV"
            echo "APP_ASSEMBLE_TASK=:app:assembleRelease" >> "$GITHUB_ENV"
            echo "APK_OUTPUT_DIR=release" >> "$GITHUB_ENV"
            echo "FORMAL_RELEASE_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
            echo "APP_ASSEMBLE_TASK=:app:assembleDebug" >> "$GITHUB_ENV"
            echo "APK_OUTPUT_DIR=debug" >> "$GITHUB_ENV"
            echo "FORMAL_RELEASE_BUILD=false" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK
        run: android sdk install platforms/android-37 build-tools/37.0.0
      - name: Validate OneuiXP source
        run: |
          set -euo pipefail
          python3 ./verify_no_jni.py
          python3 ./verify_migration.py
          grep -q 'android:hasFragileUserData="false"' app/src/main/AndroidManifest.xml
          grep -q 'val defaultManagerPackageName = "com.oneuixp.app"' app/build.gradle.kts
          test ! -e app/src/main/assets/xposed_init
          grep -q 'sealed interface Route : NavKey, Parcelable' app/src/main/java/com/oneuixp/app/ui/navigation3/Routes.kt
          grep -q 'iSkyJIE/OneuiXP-Releases' app/src/main/java/com/oneuixp/app/ui/util/Downloader.kt
          test -f app/src/main/resources/META-INF/xposed/java_init.list
          test -f app/src/main/resources/META-INF/xposed/scope.list
          grep -Fq 'include(":common")' settings.gradle.kts
          grep -Fq 'include(":hook")' settings.gradle.kts
          grep -Fq 'include(":stub")' settings.gradle.kts
          test -f common/src/main/java/io/github/soclear/oneuix/common/Preference.kt
          test -f hook/src/main/java/io/github/soclear/oneuix/hook/Main.kt
          test -f stub/src/main/java/android/os/SystemProperties.java
          grep -Fq 'implementation(project(":hook"))' app/build.gradle.kts
          grep -Fq 'implementation(project(":common"))' app/build.gradle.kts
          grep -Fxq 'io.github.soclear.oneuix.hook.Main' app/src/main/resources/META-INF/xposed/java_init.list
          grep -Fq 'minApiVersion=101' app/src/main/resources/META-INF/xposed/module.prop
          grep -Fq 'targetApiVersion=101' app/src/main/resources/META-INF/xposed/module.prop
          SCOPE_COUNT=$(grep -cve '^[[:space:]]*$' app/src/main/resources/META-INF/xposed/scope.list)
          test "$SCOPE_COUNT" -eq 26
          diff -u hook/src/main/resources/META-INF/xposed/scope.list app/src/main/resources/META-INF/xposed/scope.list 2>/dev/null || {
            printf '%s\n'               com.oneuixp.app               system               com.android.settings               com.android.systemui               com.samsung.android.app.notes               com.samsung.android.app.sketchbook               com.samsung.android.app.telephonyui               com.samsung.android.calendar               com.samsung.android.da.daagent               com.samsung.android.dialer               com.samsung.android.incallui               com.samsung.android.mdecservice               com.samsung.android.messaging               com.samsung.android.service.airviewdictionary               com.samsung.android.shealthmonitor               com.samsung.android.sm_cn               com.samsung.android.themecenter               com.samsung.android.video               com.samsung.android.app.watchmanager               com.sec.android.app.camera               com.sec.android.app.launcher               com.sec.android.app.samsungapps               com.sec.android.app.sbrowser               com.sec.android.daemonapp               com.sec.android.gallery3d               com.sec.android.mimage.photoretouching               | diff -u - app/src/main/resources/META-INF/xposed/scope.list
          }
          grep -Fq 'ENABLE_ONEUIX_FUNCTIONS = true' hook/src/main/java/io/github/soclear/oneuix/hook/Main.kt
          test -f hook/src/main/java/io/github/soclear/oneuix/hook/util/OneuiXPStatusReporter.kt
          test -f app/src/main/java/com/oneuixp/app/oneuix/OneuiXPreferenceBridge.kt
          test -f app/src/main/java/com/oneuixp/app/oneuix/OneuiXFeatureCatalog.kt
          test -f app/src/main/java/com/oneuixp/app/ui/viewmodel/OneuiXToolsViewModel.kt
          test -f app/src/main/java/com/oneuixp/app/ui/screen/tools/OneuiXCategoryScreen.kt
          grep -Fq 'data class OneuiXCategory' app/src/main/java/com/oneuixp/app/ui/navigation3/Routes.kt
          grep -Fq 'OneuiXCategory.entries' app/src/main/java/com/oneuixp/app/ui/screen/tools/ToolsScreen.kt
          grep -Fq 'ENABLE_ONEUIX_FUNCTIONS = true' hook/src/main/java/io/github/soclear/oneuix/hook/Main.kt
          test ! -e hook/src/main/resources/META-INF/xposed/java_init.list
          test ! -e hook/src/main/resources/META-INF/xposed/module.prop
          test ! -e hook/src/main/resources/META-INF/xposed/scope.list
          echo "OneuiXP API101 Flux-style single-entry migration validated; full OneUIX functional hooks enabled"

      - name: Compile OneuiXP before the owner-signing gate
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          chmod +x gradlew
          ./gradlew :common:assembleDebug :stub:assembleDebug :hook:assembleDebug :app:compileDebugKotlin -PONEUIXP_PACKAGE_NAME=com.oneuixp.app -PONEUIXP_NAME=OneuiXP --stacktrace --no-daemon 2>&1 | tee diagnostics/preflight-compile.log

      # GitHub does not sign Android packages automatically. Configure these FOUR
      # repository Actions secrets once, from the same stable owner keystore:
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      # Never fall back to a random CI debug key for an installable artifact.
      - name: Load existing owner APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing OneuiXP repository Actions secret ${key}. Configure the NEW independent permanent OneuiXP keystore generated on 2026-09-23 in this repository's Actions secrets. Cannot release a stable-signed APK without them."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/owner.keystore
          test -s app/owner.keystore

      - name: Build owner-signed OneuiXP APK
        env:
          ONEUIXP_KEYSTORE_PATH: ${{ github.workspace }}/app/owner.keystore
          ONEUIXP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ONEUIXP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ONEUIXP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          chmod +x gradlew
          ./gradlew "$APP_ASSEMBLE_TASK" -PONEUIXP_PACKAGE_NAME=com.oneuixp.app -PONEUIXP_NAME=OneuiXP --stacktrace --no-daemon 2>&1 | tee diagnostics/gradle-build.log

      - name: Validate optimized release candidate
        if: success() && github.ref == 'refs/heads/migration/public-release-repo-20260930'
        env:
          ONEUIXP_KEYSTORE_PATH: ${{ github.workspace }}/app/owner.keystore
          ONEUIXP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ONEUIXP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ONEUIXP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_CERT: 93bf61a6493c6b336383832eb41301bd8fe061f43566e7e384e3fdd9fc1c26a1
        run: |
          set -euo pipefail
          mkdir -p diagnostics/release-validation
          ./gradlew :app:assembleRelease -PONEUIXP_PACKAGE_NAME=com.oneuixp.app -PONEUIXP_NAME=OneuiXP --stacktrace --no-daemon 2>&1 | tee diagnostics/release-validation/assemble-release.log

          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -s "$RELEASE_APK"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"

          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK" | tee diagnostics/release-validation/SIGNING_INFO.txt
          CERT=$(sed -n 's/^.*certificate SHA-256 digest: //p' diagnostics/release-validation/SIGNING_INFO.txt | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = "$EXPECTED"

          "$AAPT" dump badging "$RELEASE_APK" | tee diagnostics/release-validation/APK_PACKAGE_INFO.txt
          grep -q "^package: name='com.oneuixp.app'" diagnostics/release-validation/APK_PACKAGE_INFO.txt
          grep -q "versionName='$VERSION_NAME'" diagnostics/release-validation/APK_PACKAGE_INFO.txt
          grep -q "versionCode='$VERSION_CODE'" diagnostics/release-validation/APK_PACKAGE_INFO.txt

          unzip -p "$RELEASE_APK" META-INF/xposed/java_init.list | grep -Fxq 'io.github.soclear.oneuix.hook.Main'
          unzip -p "$RELEASE_APK" META-INF/xposed/module.prop | grep -Fq 'targetApiVersion=101'
          unzip -p "$RELEASE_APK" META-INF/xposed/scope.list | grep -Fxq 'com.android.systemui'

          RELEASE_SIZE=$(stat -c%s "$RELEASE_APK")
          printf 'Optimized release APK bytes: %s\n' "$RELEASE_SIZE" | tee diagnostics/release-validation/APK_SIZE.txt

      - name: Verify package, stable certificate and prepare APK
        env:
          EXPECTED_CERT: 93bf61a6493c6b336383832eb41301bd8fe061f43566e7e384e3fdd9fc1c26a1
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find "app/build/outputs/apk/$APK_OUTPUT_DIR" -type f -name '*.apk' | head -1)
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee dist/SIGNING_INFO.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/SIGNING_INFO.txt
          CERT=$(sed -n 's/^.*certificate SHA-256 digest: //p' dist/SIGNING_INFO.txt | head -1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test -n "$CERT"
          EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          if [ "$CERT" != "$EXPECTED" ]; then
            echo '::error::OneuiXP certificate differs from the NEW permanent OneuiXP certificate.'
            exit 1
          fi
          printf '%s\n' "$CERT" > dist/SIGNING_CERT_SHA256.txt
          "$AAPT" dump badging "$APK" | tee dist/APK_PACKAGE_INFO.txt
          grep -q "^package: name='com.oneuixp.app'" dist/APK_PACKAGE_INFO.txt
          grep -q "versionName='$VERSION_NAME'" dist/APK_PACKAGE_INFO.txt
          grep -q "versionCode='$VERSION_CODE'" dist/APK_PACKAGE_INFO.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > dist/APK_MANIFEST_CHECK.txt
          grep -Eq 'hasFragileUserData.*0x0$' dist/APK_MANIFEST_CHECK.txt
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [[ "$COMMIT_SUBJECT" == release:* ]]; then
            OUTPUT_APK="OneuiXP_${VERSION_NAME}.apk"
          else
            OUTPUT_APK="OneuiXP_${VERSION_NAME}_BUILD_${GITHUB_RUN_NUMBER}.apk"
          fi
          echo "OUTPUT_APK=$OUTPUT_APK" >> "$GITHUB_ENV"
          cp "$APK" "dist/$OUTPUT_APK"
          unzip -t "dist/$OUTPUT_APK"
          unzip -p "$APK" META-INF/xposed/java_init.list | grep -Fxq 'io.github.soclear.oneuix.hook.Main'
          unzip -p "$APK" META-INF/xposed/module.prop | grep -Fq 'targetApiVersion=101'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -Fxq 'com.oneuixp.app'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -Fxq 'com.android.systemui'
          (cd dist && sha256sum "$OUTPUT_APK" > SHA256SUMS)

      - name: Publish signed APK to GitHub release
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/migration/') || startsWith(github.ref, 'refs/heads/test/'))
        env:
          SOURCE_REPO_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          PUBLIC_RELEASE_REPO: iSkyJIE/OneuiXP-Releases
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          FORMAL_RELEASE=false

          if [ "$GITHUB_REF" = "refs/heads/main" ] && [[ "$COMMIT_SUBJECT" == release:* ]]; then
            FORMAL_RELEASE=true
            RELEASE_REPO="$PUBLIC_RELEASE_REPO"
            GH_TOKEN="$PUBLIC_RELEASE_TOKEN"
            export GH_TOKEN

            if [ -z "$GH_TOKEN" ]; then
              echo "::error::Missing Actions secret RELEASE_REPO_TOKEN. It must be a fine-grained token with Contents: Read and write access to $PUBLIC_RELEASE_REPO."
              exit 1
            fi

            TAG="v${VERSION_NAME}"
            TITLE="OneuiXP ${VERSION_NAME}"
            NOTES="OneuiXP ${VERSION_NAME} 正式版。源码仓库为私有仓库；本公开仓库仅提供正式版 APK 下载和更新说明。"

            if ! gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
              # The public binary repository owns its own Git history. Do not
              # target the private source commit SHA here.
              gh release create "$TAG" \
                --repo "$RELEASE_REPO" \
                --title "$TITLE" \
                --notes "$NOTES" \
                --latest
            fi
          else
            # Migration/test builds stay with the source repository. Once the
            # source repository is private, these builds are private as well.
            RELEASE_REPO="$GITHUB_REPOSITORY"
            GH_TOKEN="$SOURCE_REPO_TOKEN"
            export GH_TOKEN

            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              TAG="main-build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
              TITLE="OneuiXP main build #${GITHUB_RUN_NUMBER}"
              NOTES="Automated signed main-branch test build. This is a prerelease, not a formal OneuiXP release."
            else
              if [[ "$GITHUB_REF" == refs/heads/test/* ]]; then
                TAG="test-build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
                TITLE="OneuiXP test build #${GITHUB_RUN_NUMBER}"
                NOTES="Signed test build. Validate on Samsung hardware before merging to main."
              else
                TAG="migration-build-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
                TITLE="OneuiXP migration build #${GITHUB_RUN_NUMBER}"
                NOTES="Signed migration test build. Validate on Samsung hardware before merging to main."
              fi
            fi

            if ! gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --repo "$RELEASE_REPO" \
                --target "$GITHUB_SHA" \
                --title "$TITLE" \
                --notes "$NOTES" \
                --prerelease
            fi
          fi

          test -n "$OUTPUT_APK"
          if [ "$FORMAL_RELEASE" = true ]; then
            gh release upload "$TAG" \
              --repo "$RELEASE_REPO" \
              "dist/$OUTPUT_APK" \
              --clobber
            echo "Published formal signed APK only to public release repo: $RELEASE_REPO / $TAG"
          else
            gh release upload "$TAG" \
              --repo "$RELEASE_REPO" \
              "dist/$OUTPUT_APK" \
              dist/SHA256SUMS \
              dist/SIGNING_INFO.txt \
              dist/APK_PACKAGE_INFO.txt \
              --clobber
            echo "Published signed test APK to source repo prerelease: $RELEASE_REPO / $TAG"
          fi

      - name: Save Gradle diagnostics on failure
        if: failure()
        run: |
          mkdir -p diagnostics
          find . -path '*/build/reports/problems/*' -type f -exec cp --parents {} diagnostics/ \; || true
      - name: Optionally mirror signed APK to Actions Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: success() && github.ref == 'refs/heads/main'
        with:
          name: OneuiXP-Owner-Signed
          path: dist/
          if-no-files-found: error
      - name: Optionally upload build diagnostics
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: failure()
        with:
          name: OneuiXP-Build-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
