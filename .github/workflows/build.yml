name: OneuiXP Android APK build
on:
  push:
    branches: [main, 'test/**']
  workflow_dispatch:
concurrency:
  group: oneuixp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK
        run: android sdk install platforms/android-37 build-tools/37.0.0
      - name: Validate OneuiXP source
        run: |
          python3 ./verify_no_jni.py
          python3 ./verify_migration.py
          grep -q 'android:hasFragileUserData="false"' app/src/main/AndroidManifest.xml
          grep -q 'applicationId = managerPackageName' app/build.gradle.kts
          grep -q 'val defaultManagerPackageName = "com.oneuixp.app"' app/build.gradle.kts
          grep -q 'SystemUiHeartbeat' app/src/main/assets/xposed_init
          grep -q '@Serializable' app/src/main/java/me/weishu/kernelsu/ui/navigation3/Routes.kt
          grep -q 'sealed interface Route : NavKey, Parcelable' app/src/main/java/me/weishu/kernelsu/ui/navigation3/Routes.kt
          echo "Root Route must remain serializable for miuix-nav"
      - name: Build OneuiXP debug APK
        run: |
          set -o pipefail
          mkdir -p diagnostics
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PKSU_PACKAGE_NAME=com.oneuixp.app -PKSU_NAME=OneuiXP --stacktrace --no-daemon 2>&1 | tee diagnostics/gradle-build.log
      - name: Validate APK and prepare delivery
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/OneuiXP_Debug.apk
          unzip -t dist/OneuiXP_Debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging dist/OneuiXP_Debug.apk | tee dist/APK_PACKAGE_INFO.txt
          grep -q "^package: name='com.oneuixp.app'" dist/APK_PACKAGE_INFO.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump xmltree dist/OneuiXP_Debug.apk AndroidManifest.xml > dist/APK_MANIFEST_CHECK.txt
          grep -Eq 'hasFragileUserData.*0x0$' dist/APK_MANIFEST_CHECK.txt
          (cd dist && sha256sum OneuiXP_Debug.apk > SHA256SUMS)
      - name: Save Gradle diagnostics on failure
        if: failure()
        run: |
          mkdir -p diagnostics
          find . -path "*/build/reports/problems/*" -type f -exec cp --parents {} diagnostics/ \; || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OneuiXP-Debug
          path: dist/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: OneuiXP-Build-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
