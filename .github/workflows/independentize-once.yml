name: One-time independent namespace migration
on:
  push:
    branches:
      - migration/independent-package-names-20261019
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    if: github.ref == 'refs/heads/migration/independent-package-names-20261019'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/independent-package-names-20261019
          fetch-depth: 0
      - name: Rename project namespace and paths
        run: |
          set -euo pipefail
          python3 .github/scripts/independentize_names.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "chore: make OneUI XP namespaces independent"
          git push origin HEAD:refs/heads/migration/independent-package-names-20261019
