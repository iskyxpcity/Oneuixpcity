name: Restore verified #671 power sampling

on:
  push:
    branches:
      - test/status-bluetooth-flux-20261002
    paths:
      - .github/workflows/restore_power_671.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/status-bluetooth-flux-20261002
          fetch-depth: 0

      - name: Restore #671 sampling implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBarPowerRuntime.kt')
          text = path.read_text()
          start_marker = '    private fun readBatteryPowerSupplyValue(name: String): Double? {'
          end_marker = '    private fun readCpuTemperature(): Double? {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          restored = '''    private fun readSample(
              context: Context,
              current: Preference.SystemUI.StatusBarPowerRuntime,
          ): Sample {
              val batteryManager = context.getSystemService(BatteryManager::class.java)
              val currentUa = batteryManager
                  ?.getIntProperty(BatteryManager.BATTERY_PROPERTY_CURRENT_NOW)
                  ?.takeUnless { it == Int.MIN_VALUE }
              val batteryIntent = runCatching {
                  context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
              }.getOrNull()

              val voltageMv = batteryIntent
                  ?.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0)
                  ?.takeIf { it > 0 }
              val tempTenths = batteryIntent
                  ?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, Int.MIN_VALUE)
                  ?.takeUnless { it == Int.MIN_VALUE }
              val level = batteryIntent?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
              val scale = batteryIntent?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100

              val signedCurrentMa = currentUa?.toDouble()?.div(1000.0)
              val currentMa = signedCurrentMa?.let { if (current.absoluteValue) abs(it) else it }
              val signedPowerW = if (currentUa != null && voltageMv != null) {
                  currentUa.toDouble() / 1_000_000.0 * voltageMv.toDouble() / 1000.0
              } else null
              val powerW = signedPowerW?.let { if (current.absoluteValue) abs(it) else it }

              return Sample(
                  powerW = powerW,
                  currentMa = currentMa,
                  batteryTempC = tempTenths?.toDouble()?.div(10.0),
                  cpuTempC = readCpuTemperature(),
                  voltageV = voltageMv?.toDouble()?.div(1000.0),
                  batteryLevel = if (level >= 0 && scale > 0) level * 100.0 / scale else null,
              )
          }

'''
          path.write_text(text[:start] + restored + text[end:])
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBarPowerRuntime.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore verified #671 power sampling'
          git push origin HEAD:test/status-bluetooth-flux-20261002
