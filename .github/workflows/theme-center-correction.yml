name: Temporary Theme Center merge correction
on:
  push:
    branches: [ "test/theme-store-service-20261024" ]
    paths:
      - ".github/workflows/theme-center-correction.yml"
      - "tools/theme-store-source.rar.b64"
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/theme-store-source.rar.b64 > /tmp/theme-store-source.rar
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          mkdir -p extracted
          7z x /tmp/theme-store-source.rar -oextracted -y
      - name: Apply correction
        run: python3 tools/correct-theme-center.py
      - name: Remove temporary tooling and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          git rm -f tools/theme-store-source.rar.b64 tools/correct-theme-center.py .github/workflows/theme-center-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(theme-store): merge region controls into existing theme center card"
          git push origin HEAD:test/theme-store-service-20261024
