name: Temporary OneUI logo aspect-ratio correction
on:
  push:
    branches:
      - migration/oneui-aloha-full-identity-20261020
permissions:
  contents: write
jobs:
  aspect:
    if: contains(github.event.head_commit.message, '[aloha-logo-aspect]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/oneui-aloha-full-identity-20261020
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve Logo002 visible proportions and tighten layout
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow numpy
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np

          root = Path(".")
          original = root / "Logo002.png"
          runtime = root / "app/src/main/res/drawable-nodpi/logo002.webp"
          startup = root / "app/src/main/java/com/oneuialoha/app/ui/StartupActivity.kt"
          material = root / "app/src/main/java/com/oneuialoha/app/ui/screen/about/AboutMaterial.kt"
          miuix = root / "app/src/main/java/com/oneuialoha/app/ui/screen/about/AboutMiuix.kt"
          docs = root / "docs/PROJECT_STRUCTURE.md"
          for p in (original, runtime, startup, material, miuix, docs):
              if not p.is_file():
                  raise SystemExit(f"Required file missing: {p}")

          source = Image.open(original).convert("RGBA")
          alpha = np.asarray(source.getchannel("A"))
          if int(alpha.min()) == 255:
              raise SystemExit("Logo002 original unexpectedly has no transparency; refusing a destructive crop")
          ys, xs = np.where(alpha > 8)
          if len(xs) == 0:
              raise SystemExit("Logo002 has no visible image content")
          bbox = (int(xs.min()), int(ys.min()), int(xs.max())+1, int(ys.max())+1)
          visible = source.crop(bbox)
          visible_ratio = visible.width / visible.height

          # 640x506 closely matches Logo002's natural visible ratio (~1.264:1).
          # Unlike the prior square letterbox, this makes the artwork fill almost the
          # entire 200dp-tall display without geometric distortion or vertical padding.
          canvas_size = (640, 506)
          margin = 0.98
          scale = min(canvas_size[0] * margin / visible.width,
                      canvas_size[1] * margin / visible.height)
          size = (max(1, round(visible.width * scale)),
                  max(1, round(visible.height * scale)))
          resized = visible.resize(size, Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", canvas_size, (0, 0, 0, 0))
          canvas.alpha_composite(resized, ((canvas_size[0]-size[0])//2,
                                           (canvas_size[1]-size[1])//2))
          alpha_before = canvas.getchannel("A").tobytes()
          canvas.save(runtime, "WEBP", lossless=False, quality=90, method=6, alpha_quality=100)
          check = Image.open(runtime).convert("RGBA")
          if check.size != canvas_size:
              raise SystemExit(f"Wrong Logo002 runtime size: {check.size}")
          if check.getchannel("A").tobytes() != alpha_before:
              raise SystemExit("Logo002 Alpha changed during WebP recompression")
          print(f"Logo002 original={source.size}; visible bbox={bbox}; visible natural ratio={visible_ratio:.4f}; runtime={check.size}; {runtime.stat().st_size} bytes")

          def replace_once(path, old, new):
              content = path.read_text(encoding="utf-8")
              if content.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match for {old!r}, found {content.count(old)}")
              path.write_text(content.replace(old, new, 1), encoding="utf-8")

          # Treat 200dp as the displayed image height and calculate its width from
          # the bitmap's real aspect ratio so the full artwork remains visible.
          replace_once(
              startup,
              "        val size = dp(200f)\n        val cx = width / 2f\n        val cy = height * 0.43f\n\n        val half = size / 2f\n        val dst = RectF(cx - half, cy - half, cx + half, cy + half)",
              "        val size = dp(200f)\n        val imageWidth = size * (logo.width.toFloat() / logo.height.toFloat())\n        val cx = width / 2f\n        val cy = height * 0.43f\n\n        val halfWidth = imageWidth / 2f\n        val halfHeight = size / 2f\n        val dst = RectF(cx - halfWidth, cy - halfHeight, cx + halfWidth, cy + halfHeight)",
          )
          replace_once(material, ".size(200.dp)", ".size(width = 253.dp, height = 200.dp)")
          replace_once(miuix, ".size(200.dp)", ".size(width = 253.dp, height = 200.dp)")

          doc = docs.read_text(encoding="utf-8")
          doc = doc.replace(
              "统一以 200dp 使用同一份 R.drawable.logo002。运行时 Logo002 从原始 PNG 的可见区域裁去透明留白后再缩放到 640×640，以使图案实际填满更多显示区域；开屏图案下移并缩短两行标题距离，两套关于页图案组下移 16dp 且 Logo 与应用名称的 Compose 间距设为 0dp。",
              "统一使用同一份 R.drawable.logo002；按 Logo002 原图自然比例将显示高度设为 200dp、宽度约 253dp，避免将横向图案塞入正方形后上下出现大段透明留白。资源裁去真实透明边后为 640×506 WebP；开屏图案下移并缩短两行标题距离，两套关于页图案组下移 16dp，Logo 与应用名称的 Compose 间距为 0dp。"
          )
          docs.write_text(doc, encoding="utf-8")
          PY
      - name: Commit aspect-ratio resource and layout, remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-oneui-logo-aspect.yml
          git add app/src/main/res/drawable-nodpi/logo002.webp app/src/main/java/com/oneuialoha/app/ui/StartupActivity.kt app/src/main/java/com/oneuialoha/app/ui/screen/about/AboutMaterial.kt app/src/main/java/com/oneuialoha/app/ui/screen/about/AboutMiuix.kt docs/PROJECT_STRUCTURE.md
          git diff --cached --check
          git commit -m "fix: show Logo002 at natural aspect ratio and close text gap [generated-aloha-aspect]"
          git push origin HEAD:refs/heads/migration/oneui-aloha-full-identity-20261020
