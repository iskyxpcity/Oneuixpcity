name: Import upstream status icon assets

on:
  push:
    branches:
      - feature/status-icon-styles-complete-port-20261127
    paths:
      - .github/workflows/import-status-icon-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/status-icon-styles-complete-port-20261127
          fetch-depth: 1
      - name: Fetch upstream icon resources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/iskyxpcity/App20261018Aloha.git /tmp/upstream
          cd /tmp/upstream
          git sparse-checkout set app/src/main/assets/battery_icons app/src/main/assets/wifi_signal_icons app/src/main/assets/mobile_signal_icons app/src/main/assets/bluetooth_status_icons app/src/main/assets/vpn_status_icons app/src/main/assets/signal_import_style30_49_summary.json
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/assets/status_icon_styles
          cp -a /tmp/upstream/app/src/main/assets/battery_icons app/src/main/assets/status_icon_styles/
          cp -a /tmp/upstream/app/src/main/assets/wifi_signal_icons app/src/main/assets/status_icon_styles/
          cp -a /tmp/upstream/app/src/main/assets/mobile_signal_icons app/src/main/assets/status_icon_styles/
          cp -a /tmp/upstream/app/src/main/assets/bluetooth_status_icons app/src/main/assets/status_icon_styles/
          cp -a /tmp/upstream/app/src/main/assets/vpn_status_icons app/src/main/assets/status_icon_styles/
          cp /tmp/upstream/app/src/main/assets/signal_import_style30_49_summary.json app/src/main/assets/status_icon_styles/
          rm .github/workflows/import-status-icon-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/status_icon_styles .github/workflows/import-status-icon-assets.yml
          git commit -m "Import complete upstream status icon resources"
          git push origin HEAD:feature/status-icon-styles-complete-port-20261127
