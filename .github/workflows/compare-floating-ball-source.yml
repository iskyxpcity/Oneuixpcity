name: Extract floating-ball source archive for comparison
on:
  push:
    branches: [test/floating-ball-source-merge-20261024]
    paths:
      - '.github/workflows/compare-floating-ball-source.yml'
  workflow_dispatch:
    branches: [test/floating-ball-source-merge-20261024]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Download and extract original source archive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          mkdir -p /tmp/ball-src .source-compare/archive
          curl -fL --retry 3 \
            'https://raw.githubusercontent.com/iskyxpcity/AppData/main/%E6%82%AC%E6%B5%AE%E7%90%83%E6%A8%A1%E5%9D%97%E6%BA%90%E7%A0%81.rar' \
            -o /tmp/ball-src/source.rar
          echo 'Archive SHA256:'
          sha256sum /tmp/ball-src/source.rar
          7z x -y -o/tmp/ball-src/extracted /tmp/ball-src/source.rar
          find /tmp/ball-src/extracted -type f -print
          for name in \
            GlobalQuickActions.kt \
            GlobalQuickActionsFloatingBall.kt \
            GlobalQuickActionsModels.kt \
            GlobalShortcutActionsScreen.kt \
            Preference.kt; do
            found=$(find /tmp/ball-src/extracted -type f -name "$name" -print -quit)
            test -n "$found" || { echo "Missing expected source file: $name"; exit 1; }
            cp "$found" ".source-compare/archive/$name"
          done
          test "$(find .source-compare/archive -maxdepth 1 -type f | wc -l)" -eq 5
          cat > .source-compare/archive/ARCHIVE_INFO.txt <<'EOF'
          Source: iskyxpcity/AppData main / 悬浮球模块源码.rar
          Expected archive SHA: e1ded8f4264d677529d7341262e4ea83608e6ba5 (Git blob)
          This directory is temporary comparison material, not application source.
          EOF
      - name: Commit extracted comparison copies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .source-compare/archive
          git commit -m 'chore: stage original floating-ball sources for comparison'
          git push origin "HEAD:${GITHUB_REF_NAME}"
