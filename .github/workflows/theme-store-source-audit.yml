name: Temporary Theme Store source audit
on:
  push:
    branches: ["test/theme-store-service-20261024"]
    paths:
      - "tools/theme-store-source.rar.b64"
      - ".github/workflows/theme-store-source-audit.yml"
permissions:
  contents: read
  actions: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and compare every archived source file
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y p7zip-full >/dev/null
          base64 -d tools/theme-store-source.rar.b64 > /tmp/theme-store-source.rar
          mkdir -p /tmp/theme-store-source
          7z x /tmp/theme-store-source.rar -o/tmp/theme-store-source -y >/dev/null
          echo "=== ARCHIVE CONTENTS / SOURCE DIFF ==="
          find /tmp/theme-store-source -type f -print0 | sort -z | while IFS= read -r -d '' f; do
            rel="${f#/tmp/theme-store-source/}"
            sha="$(sha256sum "$f" | cut -d' ' -f1)"
            if [ -f "$rel" ]; then
              localsha="$(sha256sum "$rel" | cut -d' ' -f1)"
              if [ "$sha" = "$localsha" ]; then state=SAME; else state=DIFF; fi
            else
              state=NEW
            fi
            printf '%s\t%s\t%s\n' "$state" "$rel" "$(wc -c < "$f")"
          done
          echo "=== ARCHIVE TREE ==="
          find /tmp/theme-store-source -type f -printf '%P\t%s bytes\n' | sort
