name: Apply OneuiXP three-card theme previews
on:
  push:
    branches: ['test/kernel-ui-dual-theme-20260922']
    paths: ['.github/workflows/apply-preview-layout.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/test/kernel-ui-dual-theme-20260922'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact preview patch
        run: python3 scripts/patch_oneuixp_theme_previews.py
      - name: Commit patched previews only to testing branch
        run: |
          set -euo pipefail
          git add app/src/main/java/me/weishu/kernelsu/ui/screen/colorpalette/ColorPaletteScreenMiuix.kt app/src/main/java/me/weishu/kernelsu/ui/screen/colorpalette/ColorPaletteScreenMaterial.kt
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes produced; refusing empty patch'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Miuix and Material three-card theme previews'
          git push origin HEAD:refs/heads/test/kernel-ui-dual-theme-20260922
