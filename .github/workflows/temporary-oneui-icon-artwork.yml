name: Temporary OneUI 9 artwork regeneration
on:
  push:
    branches:
      - migration/oneui-aloha-full-identity-20261020
permissions:
  contents: write
jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[aloha-rebuild-oneui-icons]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/oneui-aloha-full-identity-20261020
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild clean Logo001 launcher artwork and trim Logo002
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow numpy opencv-python-headless
          python <<'PY'
          from pathlib import Path
          import cv2
          import numpy as np
          from PIL import Image, ImageFilter

          root = Path(".")
          logo001 = root / "Logo001.jpg"
          logo002 = root / "Logo002.png"
          fg_path = root / "app/src/main/res/drawable-nodpi/ic_launcher_foreground_logo001.webp"
          legacy_path = root / "app/src/main/res/mipmap-nodpi/ic_launcher.webp"
          runtime_logo002 = root / "app/src/main/res/drawable-nodpi/logo002.webp"
          colors_path = root / "app/src/main/res/values/ic_launcher_colors.xml"
          startup_path = root / "app/src/main/java/com/oneuialoha/app/ui/StartupActivity.kt"
          material_path = root / "app/src/main/java/com/oneuialoha/app/ui/screen/about/AboutMaterial.kt"
          miuix_path = root / "app/src/main/java/com/oneuialoha/app/ui/screen/about/AboutMiuix.kt"
          structure_path = root / "docs/PROJECT_STRUCTURE.md"

          required = [logo001, logo002, fg_path, legacy_path, runtime_logo002, colors_path,
                      startup_path, material_path, miuix_path, structure_path]
          for p in required:
              if not p.is_file():
                  raise SystemExit(f"Required source/resource missing: {p}")

          BG = (231, 232, 230)

          def trim_to_visible(im, threshold=8):
              rgba = im.convert("RGBA")
              alpha = np.array(rgba.getchannel("A"))
              ys, xs = np.where(alpha > threshold)
              if len(xs) == 0:
                  raise SystemExit("Cannot trim an image with no visible pixels")
              box = (int(xs.min()), int(ys.min()), int(xs.max()) + 1, int(ys.max()) + 1)
              return rgba.crop(box), box

          def remove_edge_connected_checkerboard(im):
              """Remove only light neutral checkerboard pixels connected to the source edges."""
              rgb_image = im.convert("RGB")
              arr = np.asarray(rgb_image)
              # Checkerboard pixels are bright, almost-neutral grey/white. Restrict
              # removal to edge-connected regions, preserving enclosed light logo details.
              hi = arr.max(axis=2).astype(np.int16)
              lo = arr.min(axis=2).astype(np.int16)
              chroma = hi - lo
              gray = cv2.cvtColor(arr, cv2.COLOR_RGB2GRAY)
              candidate = ((gray >= 155) & (chroma <= 52)).astype(np.uint8)
              count, labels, stats, _ = cv2.connectedComponentsWithStats(candidate, connectivity=4)
              if count <= 1:
                  return rgb_image.convert("RGBA"), 0.0
              edge_labels = np.unique(np.concatenate((labels[0, :], labels[-1, :],
                                                      labels[:, 0], labels[:, -1])))
              edge_labels = edge_labels[edge_labels > 0]
              if len(edge_labels) == 0:
                  raise SystemExit("Logo001 checkerboard removal found no neutral edge background")
              bg = np.isin(labels, edge_labels)
              ratio = float(bg.mean())
              if ratio < 0.02:
                  raise SystemExit(f"Only {ratio:.2%} of Logo001 was identified as checkerboard; refusing risky auto-cut")
              # Expand transparent cutout by one source pixel to remove JPEG white/grey halos.
              bg = cv2.dilate(bg.astype(np.uint8), np.ones((3, 3), np.uint8), iterations=1).astype(bool)
              alpha = np.where(bg, 0, 255).astype(np.uint8)
              rgba = np.dstack((arr, alpha))
              return Image.fromarray(rgba, "RGBA"), ratio

          def fit_center_square(im, side, occupancy=0.96):
              im = im.convert("RGBA")
              # Keep edge alpha clean and ensure the image content fills the square
              # predictably instead of scaling the old padded 512px canvas as-is.
              scale = min((side * occupancy) / im.width, (side * occupancy) / im.height)
              size = (max(1, round(im.width * scale)), max(1, round(im.height * scale)))
              art = im.resize(size, Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (side, side), (0, 0, 0, 0))
              canvas.alpha_composite(art, ((side-size[0])//2, (side-size[1])//2))
              return canvas

          # 1) Rebuild Logo001 directly from the unchanged original JPG, not from any
          # prior converted/possibly clipped runtime icon.
          original001 = Image.open(logo001)
          raw_size = original001.size
          clean001, removed_ratio = remove_edge_connected_checkerboard(original001)
          cropped001, crop_box = trim_to_visible(clean001, threshold=8)
          # Remove residual full-transparent edge, then fit the full logo content
          # into a 512px transparent source bitmap with only 2% clear margin.
          fg = fit_center_square(cropped001, 512, occupancy=0.96)
          fg.save(fg_path, "WEBP", lossless=True, quality=100, method=6, exact=True)

          # 2) Draw a One UI-style squircle legacy icon from the same clean artwork.
          # The supersampled superellipse creates smooth Galaxy-like rounded corners;
          # pixels outside the silhouette are genuinely transparent.
          size = 512
          scale = 4
          high = size * scale
          yy, xx = np.mgrid[0:high, 0:high].astype(np.float32)
          nx = (2.0 * (xx + 0.5) / high) - 1.0
          ny = (2.0 * (yy + 0.5) / high) - 1.0
          superellipse = (np.abs(nx) ** 4.0 + np.abs(ny) ** 4.0) <= 1.0
          mask_high = Image.fromarray(np.where(superellipse, 255, 0).astype(np.uint8), "L")
          mask = mask_high.resize((size, size), Image.Resampling.LANCZOS)

          tile = Image.new("RGBA", (size, size), (*BG, 255))
          tile_art = fit_center_square(cropped001, size, occupancy=0.68)
          tile.alpha_composite(tile_art)
          tile.putalpha(Image.fromarray(np.minimum(np.asarray(tile.getchannel("A")),
                                                   np.asarray(mask)).astype(np.uint8), "L"))
          tile.save(legacy_path, "WEBP", lossless=True, quality=100, method=6, exact=True)

          # 3) Crop Logo002 to its actual visible artwork and repack it once, near
          # the 200dp display size. This eliminates invisible padding that made the
          # apparent logo much smaller and the gap above the title look excessive.
          original002 = Image.open(logo002).convert("RGBA")
          size002 = original002.size
          alpha002 = np.asarray(original002.getchannel("A"))
          if int(alpha002.min()) == 255:
              # If it is actually a flattened checkerboard JPG-like image, remove only
              # edge-connected neutral backdrop in the same conservative way.
              clean002, ratio002 = remove_edge_connected_checkerboard(original002)
              cropped002, crop002_box = trim_to_visible(clean002, threshold=8)
          else:
              cropped002, crop002_box = trim_to_visible(original002, threshold=8)
              ratio002 = 0.0
          visible002 = fit_center_square(cropped002, 640, occupancy=0.98)
          visible002.save(runtime_logo002, "WEBP", lossless=True, quality=100, method=6, exact=True)

          # 4) Adaptive background is an even solid fill; Samsung One UI applies its
          # native mask. No checkerboard is part of the artwork. Legacy fallback is
          # also the same Logo001 artwork inside a manually rendered One UI squircle.
          colors_path.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="oneui_aloha_icon_background">#E7E8E6</color>\n'
              '</resources>\n',
              encoding="utf-8"
          )

          def replace_once(path, old, new):
              content = path.read_text(encoding="utf-8")
              n = content.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {n}: {old!r}")
              path.write_text(content.replace(old, new, 1), encoding="utf-8")

          # Splash: move the logo lower on the screen and close the gap to both title rows.
          replace_once(startup_path, "val cy = height * 0.40f", "val cy = height * 0.43f")
          replace_once(
              startup_path,
              "val y = height * 0.40f + dp(200f) / 2f + dp(31f) + dp(8f) * (1f - progress)",
              "val y = height * 0.43f + dp(200f) / 2f + dp(22f) + dp(6f) * (1f - progress)",
          )
          replace_once(
              startup_path,
              "val baseline = height * 0.40f + dp(200f) / 2f + dp(73f)",
              "val baseline = height * 0.43f + dp(200f) / 2f + dp(55f)",
          )

          # Material About: move the whole logo group down slightly and set the logo
          # directly against its title; do not clip the logo art to an arbitrary round rect.
          replace_once(material_path, ".padding(top = 64.dp, bottom = 20.dp),",
                       ".padding(top = 80.dp, bottom = 20.dp),")
          replace_once(material_path, "modifier = Modifier.padding(top = 4.dp),",
                       "modifier = Modifier.padding(top = 0.dp),")
          replace_once(material_path, "                            .clip(RoundedCornerShape(16.dp))\n", "")
          mat_content = material_path.read_text(encoding="utf-8")
          mat_content = mat_content.replace("import androidx.compose.foundation.shape.RoundedCornerShape\n", "")
          material_path.write_text(mat_content, encoding="utf-8")

          # Miuix About: move its logo group down 16dp, shrink the gap to zero, and
          # keep the invisible scroll spacer in step with the visible group.
          replace_once(miuix_path, "top = logoPadding.calculateTopPadding() + 68.dp,",
                       "top = logoPadding.calculateTopPadding() + 84.dp,")
          replace_once(miuix_path, ".padding(top = 4.dp, bottom = 5.dp)",
                       ".padding(top = 0.dp, bottom = 5.dp)")
          replace_once(
              miuix_path,
              "logoHeightDp + 68.dp + logoPadding.calculateTopPadding() - scrollPadding.calculateTopPadding() + 126.dp,",
              "logoHeightDp + 84.dp + logoPadding.calculateTopPadding() - scrollPadding.calculateTopPadding() + 126.dp,",
          )

          # Documentation follows the concrete current design; originals remain untouched.
          structure = structure_path.read_text(encoding="utf-8")
          structure = structure.replace(
              "以前景安全区包装资源 `drawable/ic_launcher_foreground_safe.xml` 引用 `drawable-nodpi/ic_launcher_foreground_logo001.webp`，透明背景层保留真正 Alpha，由 Samsung One UI 9 启动器应用系统圆角蒙版。",
              "以透明前景 `drawable/ic_launcher_foreground_logo001.webp` 放在自适应图标中央安全区，由 Samsung One UI 9 启动器应用系统圆角蒙版，图标内背景为无网格的纯色 `#E7E8E6`。旧版 Android 的 `mipmap-nodpi/ic_launcher.webp` 用同一 Logo001 重绘为带真正透明外角的 One UI 风格 superellipse 圆角方形。"
          )
          structure = structure.replace(
              "Logo001 的运行时前景保留真正透明 Alpha，并通过 60dp 居中安全区包装避免重要图案被 One UI 启动器蒙版裁切；Samsung 系统负责 Android 8.0+ 图标外轮廓，不在源 Logo 上手工叠加白色网格或硬裁切。",
              "Logo001 每次均从未经修改的根目录原图重新生成，先清理边缘连通的棋盘背景，再裁掉外部透明边；生成的前景保留 Alpha 并完整置于自适应图标安全区，旧版回退图标同样以原稿重绘并做真正透明外角。"
          )
          structure = structure.replace(
              "开屏图案下移，并把两行标题基线与 Logo 的距离分别收紧；两套关于页减少图案与应用名称的间隔。",
              "Logo002 运行时资源由原始 `Logo002.png` 裁掉透明留白后再缩放至 640×640，尽可能填满 200dp 显示容器；开屏图案下移并收紧两行标题基线，两套关于页组整体下移且图文间距收至 0dp。"
          )
          structure_path.write_text(structure, encoding="utf-8")

          # Output diagnostics for checking the actual generated artwork in CI.
          fg_check = Image.open(fg_path).convert("RGBA")
          legacy_check = Image.open(legacy_path).convert("RGBA")
          logo002_check = Image.open(runtime_logo002).convert("RGBA")
          fg_alpha = np.asarray(fg_check.getchannel("A"))
          legacy_alpha = np.asarray(legacy_check.getchannel("A"))
          logo002_alpha = np.asarray(logo002_check.getchannel("A"))
          assert fg_check.size == (512, 512) and fg_alpha.min() == 0 and fg_alpha.max() == 255
          assert legacy_check.size == (512, 512) and legacy_alpha.min() == 0 and legacy_alpha.max() == 255
          assert all(legacy_alpha[y, x] == 0 for x, y in [(0,0),(511,0),(0,511),(511,511)])
          assert logo002_check.size == (640, 640)
          assert "android:roundIcon" in (root / "app/src/main/AndroidManifest.xml").read_text()
          assert "ic_launcher_foreground_safe" in (root / "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml").read_text()
          assert "val cy = height * 0.43f" in startup_path.read_text()
          assert ".size(200.dp)" in material_path.read_text()
          assert ".size(200.dp)" in miuix_path.read_text()
          print(f"Logo001 original size={raw_size}, edge-connected checkerboard removed={removed_ratio:.2%}, visible bbox={crop_box}, rebuilt foreground={fg_path.stat().st_size} bytes")
          print(f"Legacy One UI squircle={legacy_path.stat().st_size} bytes, corner alpha=0; no checkerboard pixels baked into background")
          print(f"Logo002 original size={size002}, visible bbox={crop002_box}, flattened background removed={ratio002:.2%}, packed runtime=640x640/{runtime_logo002.stat().st_size} bytes")
          print("Splash and both About layouts: same Logo002 at 200dp; splash shifted down, logo-to-text gap tightened; About group lowered and gap set to 0dp.")
          PY
      - name: Commit regenerated images and layout, then dispatch the real build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-oneui-icon-artwork.yml
          git add app/src/main/res/drawable-nodpi/ic_launcher_foreground_logo001.webp app/src/main/res/mipmap-nodpi/ic_launcher.webp app/src/main/res/drawable-nodpi/logo002.webp app/src/main/res/values/ic_launcher_colors.xml app/src/main/java/com/oneuialoha/app/ui/StartupActivity.kt app/src/main/java/com/oneuialoha/app/ui/screen/about/AboutMaterial.kt app/src/main/java/com/oneuialoha/app/ui/screen/about/AboutMiuix.kt docs/PROJECT_STRUCTURE.md
          git diff --cached --check
          git commit -m "fix: redraw OneUI 9 icon from Logo001 and tighten logo spacing [generated-aloha-artwork]"
          git push origin HEAD:refs/heads/migration/oneui-aloha-full-identity-20261020
          gh workflow run build.yml --ref migration/oneui-aloha-full-identity-20261020
