name: Patch power overlay restart

on:
  push:
    branches:
      - test/status-bluetooth-flux-20261002
    paths:
      - tools/patch_power_overlay_restart.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/status-bluetooth-flux-20261002
          fetch-depth: 0
      - name: Apply restart-safe overlay patch
        run: python3 tools/patch_power_overlay_restart.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBarPowerRuntime.kt app/src/main/java/com/oneuixp/app/ui/screen/status/StatusPowerRuntimeControls.kt
          git diff --cached --check
          git commit -m "fix: restore power overlay after SystemUI restart" || exit 0
          git push origin HEAD:test/status-bluetooth-flux-20261002
