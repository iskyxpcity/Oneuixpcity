name: OneUI XP namespace migration
on:
  push:
    branches:
      - test/oneuixp-independent-namespace-20261019
permissions:
  contents: write
  actions: write
concurrency:
  group: oneuixp-namespace-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply path and internal namespace migration
        run: |
          set -euo pipefail
          python3 scripts/oneuixp_namespace_migration.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No migration diff was produced; refusing a false-success run.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: detach OneuiXP package namespace and source paths'
          git rm scripts/oneuixp_namespace_migration.py .github/workflows/oneuixp-namespace-migration.yml
          git commit -m 'chore: remove temporary namespace migration runner'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          curl --fail --silent --show-error --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "{\"ref\":\"${GITHUB_REF_NAME}\"}" \
            'https://api.github.com/repos/iskyxpcity/Oneuixpcity/actions/workflows/build.yml/dispatches'
        env:
          GITHUB_TOKEN: ${{ github.token }}
