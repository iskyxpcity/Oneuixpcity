name: Patch fixed power overlay

on:
  push:
    branches:
      - test/status-bluetooth-flux-20261002
    paths:
      - tools/patch_fixed_power_overlay.py
      - .github/workflows/patch_fixed_power_overlay.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/status-bluetooth-flux-20261002
          fetch-depth: 0
      - name: Apply fixed overlay and haptics patch
        run: python3 tools/patch_fixed_power_overlay.py
      - name: Commit patched sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBarPowerRuntime.kt app/src/main/java/com/oneuixp/app/ui/screen/status/StatusPowerRuntimeControls.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep power overlay on fixed coordinates and add slider haptics'
          git push origin HEAD:test/status-bluetooth-flux-20261002
