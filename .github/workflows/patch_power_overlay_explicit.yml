name: Patch explicit power overlay

on:
  push:
    branches:
      - test/status-bluetooth-flux-20261002
    paths:
      - tools/patch_power_overlay_explicit.py
      - .github/workflows/patch_power_overlay_explicit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/status-bluetooth-flux-20261002
          fetch-depth: 0
      - name: Apply explicit overlay and 180dp patch
        run: python3 tools/patch_power_overlay_explicit.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/src/main/java/io/github/soclear/oneuix/common/StatusBarRuntimeBridge.kt hook/src/main/java/io/github/soclear/oneuix/hook/systemui/StatusBarPowerRuntime.kt app/src/main/java/com/oneuixp/app/ui/screen/status/StatusPowerRuntimeControls.kt
          git diff --cached --check
          git commit -m "fix: make power overlay command explicit and extend horizontal range" || exit 0
          git push origin HEAD:test/status-bluetooth-flux-20261002
