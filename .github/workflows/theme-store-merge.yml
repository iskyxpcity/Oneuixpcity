name: Temporary Theme Store source merge
on:
  push:
    branches: ["test/theme-store-service-20261024"]
permissions:
  contents: write
jobs:
  merge-source:
    if: contains(github.event.head_commit.message, 'stage Theme Store archive')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract source archive and merge exact Theme Store files
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y p7zip-full >/dev/null
          base64 -d tools/theme-store-source.rar.b64 > /tmp/theme-store-source.rar
          mkdir -p /tmp/theme-store-source
          7z x /tmp/theme-store-source.rar -o/tmp/theme-store-source -y >/dev/null
          echo "=== Preference diff (review only; preserve current unrelated settings) ==="
          diff -u common/src/main/java/com/alohaoneui/common/Preference.kt /tmp/theme-store-source/common/src/main/java/com/alohaoneui/common/Preference.kt || true
          echo "=== Hook Main diff (review only; preserve current unrelated hooks) ==="
          diff -u hook/src/main/java/com/alohaoneui/hook/Main.kt /tmp/theme-store-source/hook/src/main/java/com/alohaoneui/hook/Main.kt || true
          # Exact source files belonging to the Theme Store feature.
          install -D /tmp/theme-store-source/hook/src/main/java/com/alohaoneui/hook/ThemeStoreRegion.kt hook/src/main/java/com/alohaoneui/hook/ThemeStoreRegion.kt
          install -D /tmp/theme-store-source/common/src/main/java/com/alohaoneui/common/ModuleActions.kt common/src/main/java/com/alohaoneui/common/ModuleActions.kt
          install -D /tmp/theme-store-source/app/src/main/java/com/alohaoneui/mod/ui/category/DetailPaneThemeCenter.kt app/src/main/java/com/alohaoneui/mod/ui/category/DetailPaneThemeCenter.kt
          # The archive explicitly scopes the Theme Store package; keep the original list plus that required target.
          install -D /tmp/theme-store-source/app/src/main/resources/META-INF/xposed/scope.list app/src/main/resources/META-INF/xposed/scope.list
          install -D /tmp/theme-store-source/app/src/main/resources/META-INF/xposed/scope.list app/src/main/assets/xposed_scope
          grep -q 'val setThemeStoreRegion: Boolean' common/src/main/java/com/alohaoneui/common/Preference.kt
          grep -q 'val themeStoreRegionCountry: String' common/src/main/java/com/alohaoneui/common/Preference.kt
          grep -q 'ThemeStoreRegion.hook(preference.other)' hook/src/main/java/com/alohaoneui/hook/Main.kt
          grep -q 'THEME_STORE_REGION_CHANGED' common/src/main/java/com/alohaoneui/common/ModuleActions.kt
          test -f hook/src/main/java/com/alohaoneui/hook/ThemeStoreRegion.kt
          test "$(grep -cve '^[[:space:]]*$' app/src/main/resources/META-INF/xposed/scope.list)" -eq 27
          diff -u app/src/main/assets/xposed_scope app/src/main/resources/META-INF/xposed/scope.list
          # Remove temporary archive and this one-shot workflow before committing the source merge.
          git rm -f tools/theme-store-source.rar.b64 .github/workflows/theme-store-merge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hook/src/main/java/com/alohaoneui/hook/ThemeStoreRegion.kt common/src/main/java/com/alohaoneui/common/ModuleActions.kt app/src/main/java/com/alohaoneui/mod/ui/category/DetailPaneThemeCenter.kt app/src/main/resources/META-INF/xposed/scope.list app/src/main/assets/xposed_scope
          git commit -m "fix(theme-store): merge original hook and shared actions from source archive"
          git push origin HEAD:test/theme-store-service-20261024
