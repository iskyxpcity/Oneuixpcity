name: Temporary theme store integration
on:
  push:
    branches: [ "work/theme-store-source-extract-20261024" ]
    paths:
      - ".github/workflows/source-extract.yml"
      - "tools/theme-store-source.rar.b64"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decode and extract supplied source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/theme-store-source.rar.b64 > /tmp/theme-store-source.rar
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          mkdir -p extracted
          7z x /tmp/theme-store-source.rar -oextracted -y
          test -f extracted/hook/src/main/java/com/alohaoneui/hook/ThemeStoreRegion.kt
      - name: Apply reviewed integration patch
        run: python3 tools/apply-theme-store.py
      - name: Remove temporary extraction tooling and commit integration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted extracted-files.txt compare compare-files.txt
          git rm -f tools/theme-store-source.rar.b64 tools/apply-theme-store.py .github/workflows/source-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(theme-store): add theme store service region controls"
          git push origin HEAD:work/theme-store-source-extract-20261024
