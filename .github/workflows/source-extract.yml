name: Temporary theme-store source extraction
on:
  push:
    branches: [ "work/theme-store-source-extract-20261024" ]
    paths:
      - ".github/workflows/source-extract.yml"
      - "tools/theme-store-source.rar.b64"
permissions:
  contents: read
  actions: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode archive and extract RAR5
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/theme-store-source.rar.b64 > /tmp/theme-store-source.rar
          file /tmp/theme-store-source.rar
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          mkdir -p extracted
          7z x /tmp/theme-store-source.rar -oextracted -y
          find extracted -type f -printf '%P\t%s bytes\n' | sort | tee extracted-files.txt
          test "$(find extracted -type f | wc -l)" -gt 0
      - uses: actions/upload-artifact@v4
        with:
          name: theme-store-source-extracted
          path: |
            extracted/**
            extracted-files.txt
          if-no-files-found: error
