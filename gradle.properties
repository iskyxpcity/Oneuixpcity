android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37.0
alohaOneUIVersionName=1.0.261024.4
# Formal release version code increments monotonically with each public release.
alohaOneUIVersionCode=18
# Temporary compatibility key used only by the isolated Common module.
alohaOneUI.applicationId=com.alohaoneui.app
# The full app APK packaging step can exceed 2 GiB after resource processing.
# Give ZipFlinger/Dex packaging sufficient heap and reduce simultaneous workers on CI.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.tooling.parallel=false
org.gradle.vfs.watch=true
android.r8.maxWorkers=2
android.native.buildOutput=verbose
